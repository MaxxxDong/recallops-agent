      const phase = { scale: 0.97 };
      const drift = { p: 0, amp: 1 };
      const countState = { value: 0 };

      tl.to(phase, { scale: 1, duration: 1.15, ease: "power2.out" }, 0.55);
      tl.to(phase, { scale: 1.02, duration: 1.25, ease: "power2.inOut" }, 2.45);
      tl.to(phase, { scale: 1, duration: 0.32, ease: "power2.out" }, 7.25);
      tl.to(drift, { amp: 0, duration: 0.25, ease: "power2.out" }, 7.45);
      tl.to(
        drift,
        {
          p: Math.PI * 2 * 1.15,
          duration: totalDuration,
          ease: "none",
          onUpdate: () => {
            const dx = Math.sin(drift.p) * 4 * drift.amp;
            const dy = Math.sin(drift.p * 1.31) * 2.5 * drift.amp;
            camera.style.transform = `scale(${phase.scale}) translate(${dx}px, ${dy}px)`;
          },
        },

      );

      tl.fromTo(byId("kicker"), { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.52, ease: "power3.out" }, 0.05);
      tl.fromTo(byId("index"), { opacity: 0, x: 22 }, { opacity: 1, x: 0, duration: 0.46, ease: "power2.out" }, 0.14);
      tl.fromTo(byId("key"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.64, ease: "power3.out" }, 0.22);

      tl.fromTo(byId("receipt"), { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.62, ease: "power3.out" }, 1.92);
      tl.fromTo(byId("receipt-row-one"), { opacity: 0, x: -18 }, { opacity: 1, x: 0, duration: 0.38, ease: "power2.out" }, 2.26);

      tl.fromTo(ringTicks, { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.42, stagger: 0.055, ease: "power2.out" }, 3.72);

      tl.fromTo(byId("ring-foot"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 5.62);

      tl.fromTo(byId("retry"), { opacity: 0, scale: 0.82 }, { opacity: 1, scale: 1.08, duration: 0.32, ease: "power3.out" }, 6.30);
      tl.to(byId("retry"), { scale: 1, duration: 0.24, ease: "power2.out" }, 6.62);
      tl.to(byId("one-label"), { opacity: 0.18, y: -10, filter: "blur(2px)", duration: 0.34, ease: "power2.in" }, 6.34);
      tl.fromTo(byId("execution-label"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.48, ease: "power3.out" }, 6.54);

      tl.to([byId("retry"), byId("ring-foot"), ...ringTicks], { opacity: 0.16, duration: 0.44, ease: "power2.out" }, 7.50);
