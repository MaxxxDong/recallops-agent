  <script>
    (() => {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["01-survive-failure"] = tl;

      const byId = (id) => document.getElementById(`01-survive-failure-${id}`);
      const recovery = byId("recovery");
      const failed = byId("failed");
      const pin = byId("pin");
      const idLink = byId("id-link");
      const centerBase = byId("center-base");
      const brokenLeft = byId("broken-left");
      const brokenRight = byId("broken-right");
      const phraseRow = byId("phrase-row");
      const glitchSlices = gsap.utils.toArray('[class~="01-survive-failure-glitch-slice"]');
      const nodes = [byId("node-left"), byId("node-middle"), byId("node-right")];
      const labels = [byId("label-left"), byId("label-middle"), byId("label-right")];
      const rails = [byId("rail-left"), byId("rail-right")];

      const glitchHash = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
      };

      tl.set(failed, { opacity: 0 }, 0);
      tl.set([brokenLeft, brokenRight], { opacity: 0 }, 0);
      tl.set(glitchSlices, { opacity: 0, x: 0, y: 0, scaleX: 1 }, 0);
      tl.set(labels, { opacity: 0 }, 0);
      tl.set(phraseRow, { opacity: 0 }, 0);

      const phraseContent = [
        { id: "phrase-remember", body: "REMEMBER", hold: 0.18 },
        { id: "phrase-where", body: "WHERE IT", hold: 0.2 },
        { id: "phrase-stopped", body: "STOPPED", hold: 0.52 },
      ];
      const phraseBaseDuration = 0.24;
      const phraseSecondsPerCharacter = 0.018;
      let phraseCumulative = 0;
      const phraseTimeline = phraseContent.map((entry) => {
        const duration = phraseBaseDuration + entry.body.length * phraseSecondsPerCharacter + entry.hold;
        const start = phraseCumulative;
        phraseCumulative += duration;
        return { ...entry, start, end: phraseCumulative };
      });
      const phraseWindow = 1.34;
      const phraseScale = phraseWindow / phraseCumulative;
      const phraseElements = phraseTimeline.map((entry) => byId(entry.id));
      tl.set(phraseElements, { opacity: 0 }, 0);

      tl.fromTo(
        byId("kicker"),
        { opacity: 0, y: -12 },
        { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
        0.02,
      );
      tl.fromTo(
        pin,
        { opacity: 0, y: -18 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" },
        0.08,
      );
      tl.fromTo(
        idLink,
        { opacity: 0, scaleY: 0, transformOrigin: "top center" },
        { opacity: 1, scaleY: 1, duration: 0.66, ease: "power2.out" },
        0.24,
      );
      tl.fromTo(
        recovery,
        { opacity: 0, scale: 0.94, filter: "blur(10px)" },
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.42, ease: "expo.out" },
        0.06,
      );
      tl.fromTo(
        byId("state-rule"),
        { opacity: 0, scaleX: 0, transformOrigin: "center center" },
        { opacity: 1, scaleX: 1, duration: 0.52, ease: "power3.out" },
        0.4,
      );

      rails.forEach((rail, index) => {
        tl.fromTo(
          rail,
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.5, ease: "power2.out" },
          0.42 + index * 0.26,
        );
      });
      tl.fromTo(
        centerBase,
        { opacity: 0, scaleX: 0 },
        { opacity: 1, scaleX: 1, duration: 0.52, ease: "power2.out" },
        0.68,
      );
      nodes.forEach((node, index) => {
        tl.fromTo(
          node,
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" },
          0.44 + index * 0.32,
        );
        tl.fromTo(
          labels[index],
          { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          0.64 + index * 0.32,
        );
      });

      tl.fromTo(
        byId("scan"),
        { x: -420 },
        { x: 2340, duration: 6.4, ease: "none" },
        0,
      );

      tl.set(recovery, { opacity: 0 }, 1.7);
      tl.set(failed, { opacity: 1, scale: 1, filter: "blur(0px)" }, 1.7);
      tl.set(centerBase, { opacity: 0 }, 1.7);
      tl.set([brokenLeft, brokenRight], { opacity: 1 }, 1.7);

      glitchSlices.forEach((slice, index) => {
        const bandHeight = 100 / glitchSlices.length;
        const top = index * bandHeight;
        const bottom = 100 - (index + 1) * bandHeight;
        const direction = glitchHash(index * 3 + 1) > 0.5 ? 1 : -1;
        const offset = 20 + glitchHash(index * 5 + 2) * 42;
        const stretch = 1 + glitchHash(index * 7 + 3) * 0.24;
        const lag = glitchHash(index * 11 + 4) * 0.07;

        gsap.set(slice, { clipPath: `inset(${top}% 0 ${bottom}% 0)` });
        tl.fromTo(
          slice,
          { x: direction * offset, scaleX: stretch, opacity: 1 },
          { x: 0, scaleX: 1, opacity: 1, duration: 0.32, ease: "steps(5)" },
          1.7 + lag,
        );
      });
      tl.fromTo(
        brokenLeft,
        { x: -30, y: -5 },
        { x: 0, y: 0, duration: 0.34, ease: "steps(4)" },
        1.72,
      );
      tl.fromTo(
        brokenRight,
        { x: 34, y: 6 },
        { x: 0, y: 0, duration: 0.34, ease: "steps(4)" },
        1.72,
      );
      tl.to(glitchSlices, { opacity: 0, duration: 0.04, ease: "none" }, 2.08);
      tl.set(glitchSlices, { x: 0, y: 0, scaleX: 1, opacity: 0 }, 2.12);

      tl.to(
        brokenLeft,
        { y: 6, duration: 0.28, ease: "power4.in" },
        4.1,
      );
      tl.to(
        brokenRight,
        { y: -6, duration: 0.28, ease: "power4.in" },
        4.1,
      );
      tl.fromTo(
        centerBase,
        { opacity: 1, scaleX: 0.05 },
        { opacity: 1, scaleX: 1, duration: 0.38, ease: "power4.out" },
        4.34,
      );
      tl.to(
        [brokenLeft, brokenRight],
        { opacity: 0, duration: 0.12, ease: "none" },
        4.34,
      );
      tl.set([brokenLeft, brokenRight], { opacity: 0, x: 0, y: 0 }, 4.46);

      tl.fromTo(
        phraseRow,
        { opacity: 0 },
        { opacity: 1, duration: 0.24, ease: "none" },
        4.06,
      );

      phraseTimeline.forEach((entry) => {
        const phrase = byId(entry.id);
        const start = 4.18 + entry.start * phraseScale;
        tl.fromTo(
          phrase,
          { opacity: 0, y: 30, filter: "blur(8px)" },
          { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
          start,
        );
      });
    })();
  </script>
