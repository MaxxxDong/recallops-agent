      const GOLDEN = Math.PI * (3 - Math.sqrt(5));
      const count = frags.length;
      const scatter = frags.map((fragment, index) => {
        const angle = index * GOLDEN;
        const depthT = count > 1 ? index / (count - 1) : 0;
        return {
          x: Math.cos(angle) * 470,
          y: Math.sin(angle) * 270,
          z: 320 - depthT * 690,
          rotationX: Math.sin(angle) * 72,
          rotationY: Math.cos(angle) * 72,
        };
      });

          xPercent: -50,

          ...scatter[index],
