[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recallops-agent"
version = "0.1.0"
description = "Resumable incident memory agent for CockroachDB and AWS Lambda"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastembed==0.8.0",
  "httpx==0.28.1",
  "langchain-cockroachdb==0.2.1",
  "langgraph==1.2.9",
  "mcp==1.28.1",
  "opentelemetry-sdk==1.44.0",
  "psycopg[binary]==3.3.4",
]

[project.scripts]
recallops = "recallops.http:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recallops = ["ui.html", "ui.js", "ui.css"]
